<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>学年主任画面</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="leader.js" defer></script>
</head>
<body>
  <header>
    <h1>学年主任ダッシュボード</h1>
  </header>

  <main>
    <!-- 日付選択 -->
    <section>
      <label for="dateSelect">対象日：</label>
      <input type="date" id="dateSelect" />
      <button id="analyzeBtn">分析する</button>
    </section>

    <!-- クラス別集計 -->
    <section>
      <h2>クラス別提出率・平均体調</h2>
      <div id="classStats"></div>
    </section>

    <!-- 異常検知クラス一覧 -->
    <section>
      <h2>異常検知クラス</h2>
      <div id="alertClasses"></div>
    </section>

    <!-- クラス別グラフ -->
    <section>
      <h2>クラス別体調スコア推移</h2>
      <canvas id="classChart"></canvas>
    </section>
  </main>
</body>
</html>
