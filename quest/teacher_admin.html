<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>担任名簿管理</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>担任名簿管理</h1>

  <!-- 担任登録フォーム -->
  <section>
    <h2>担任登録</h2>
    <form id="addTeacherForm">
      <label>担任名：<input type="text" id="teacherName" required></label><br>
      <label>ID：<input type="text" id="teacherId" required></label><br>
      <label>パスワード：<input type="text" id="teacherPassword" required></label><br>
      <label>担当クラス：<input type="text" id="teacherClass" placeholder="例：1年-A組" required></label><br>
      <button type="submit">登録</button>
    </form>
  </section>

  <!-- 担任一覧表示 -->
  <section>
    <h2>登録済み担任一覧</h2>
    <div id="teacherDisplay"></div>
  </section>

  <script>
    const teacherRoster = JSON.parse(localStorage.getItem("teacherRoster")) || {};

    // 担任登録処理
    document.getElementById("addTeacherForm").addEventListener("submit", (e) => {
      e.preventDefault();
      const name = document.getElementById("teacherName").value.trim();
      const id = document.getElementById("teacherId").value.trim();
      const password = document.getElementById("teacherPassword").value.trim();
      const classKey = document.getElementById("teacherClass").value.trim();

      if (teacherRoster[classKey]) {
        alert(`${classKey} はすでに登録されています。編集してください。`);
        return;
      }

      teacherRoster[classKey] = { name, id, password };
      localStorage.setItem("teacherRoster", JSON.stringify(teacherRoster));
      displayTeachers();
      e.target.reset();
      alert(`担任 ${name} を ${classKey} に登録しました`);
    });

    // 担任一覧表示
    function displayTeachers() {
      const container = document.getElementById("teacherDisplay");
      container.innerHTML = "";

      Object.keys(teacherRoster).forEach(classKey => {
        const teacher = teacherRoster[classKey];
        const div = document.createElement("div");
        div.className = "teacher-entry";
        div.innerHTML = `
          <strong>${classKey}</strong><br>
          ${teacher.name}（ID: ${teacher.id}）<br>
          <button onclick="editTeacher('${classKey}')">編集</button>
          <button onclick="deleteTeacher('${classKey}')">削除</button>
          <hr>
        `;
        container.appendChild(div);
      });
    }

    // 編集処理
    window.editTeacher = function (classKey) {
      const teacher = teacherRoster[classKey];
      const newName = prompt("名前を修正", teacher.name);
      const newId = prompt("IDを修正", teacher.id);
      const newPassword = prompt("パスワードを修正", teacher.password);

      if (newName && newId && newPassword) {
        teacherRoster[classKey] = {
          name: newName.trim(),
          id: newId.trim(),
          password: newPassword.trim()
        };
        localStorage.setItem("teacherRoster", JSON.stringify(teacherRoster));
        displayTeachers();
        alert("担任情報を修正しました");
      }
    };

    // 削除処理
    window.deleteTeacher = function (classKey) {
      if (confirm(`${classKey} の担任を削除しますか？`)) {
        delete teacherRoster[classKey];
        localStorage.setItem("teacherRoster", JSON.stringify(teacherRoster));
        displayTeachers();
        alert("担任を削除しました");
      }
    };

    // 初期表示
    displayTeachers();
  </script>
</body>
</html>
