<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>生徒ログイン</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>生徒ログイン</h1>

  <form id="loginForm">
    <label>ID：
      <input type="text" id="loginId" required placeholder="例：1A005">
    </label><br>

    <label>パスワード：
      <input type="password" id="loginPass" required placeholder="例：pass005">
    </label><br>

    <button type="submit">ログイン</button>
  </form>

  <p id="loginMessage" style="color: red;"></p>

  <script src="login.js"></script>
</body>
</html>
